# Build the Windows installer, the Linux AppImage and the macOS disk images,
# test them with --self-test and --release-test, and on a version tag (vX.Y.Z)
# publish them as a GitHub release with the notes of that version from
# CHANGELOG.md. A tag macos-vX.Y.Z builds only the macOS disk images and adds
# them to the existing release vX.Y.Z.
# To try the packages without a release: Actions -> packages -> Run workflow,
# on any branch (the files are kept as workflow artifacts).
name: packages

on:
  push:
    tags: ["v*", "macos-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Scorch's K40 USB driver installer (modified Zadig, GPL-3), bundled in the Windows installer;
  # the build stops if the file on the server is not this exact one
  DRIVER_URL: http://www.scorchworks.com/K40whisperer/K40_Driver_Install.exe
  DRIVER_SHA256: 6c8e96f436c71f0ade67d7437f87b4d2a53f73eb1316013d87b5353a83d15d16
  # libusb0.dll of libusb-win32 1.2.6.0 (LGPL, the version those driver installers set up), put
  # next to Kerfly.exe as K40 Whisperer does: used only when Windows has none of its own
  LIBUSB_URL: https://sourceforge.net/projects/libusb-win32/files/libusb-win32-releases/1.2.6.0/libusb-win32-bin-1.2.6.0.zip/download
  LIBUSB_SHA256: ac19715e6ace496d1a41df3714038ab0ad9b8059834ed65c55ff4e0b9ba0d2e9

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/macos-') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -r requirements-optional.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "pyclipper not installed (optional)"; $global:LASTEXITCODE = 0 }
      - name: Program folder (PyInstaller)
        run: python -m PyInstaller packaging/kerfly.spec --noconfirm
      - name: libusb0.dll next to Kerfly.exe (checked)
        run: |
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri $env:LIBUSB_URL -OutFile libusb-win32.zip -UserAgent "Wget"; break }
            catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds 15 }
          }
          $hash = (Get-FileHash libusb-win32.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LIBUSB_SHA256) { Write-Error "libusb-win32 archive changed: $hash"; exit 1 }
          Expand-Archive libusb-win32.zip -DestinationPath libusb-win32
          Copy-Item libusb-win32\libusb-win32-bin-1.2.6.0\bin\amd64\libusb0.dll dist\Kerfly\
          New-Item -ItemType Directory -Force dist\Kerfly\licenses | Out-Null
          Copy-Item libusb-win32\libusb-win32-bin-1.2.6.0\COPYING_LGPL.txt dist\Kerfly\licenses\libusb-win32-LGPL.txt
      - name: Self-test of the packaged program (must load libusb0.dll)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = & dist\Kerfly\kerfly-console.exe --self-test 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -notmatch "OK\s+USB driver") { Write-Error "the packaged program did not load libusb0.dll"; exit 1 }
      - name: Release check of the packaged program (fonts, Qt plugins, libraries)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & dist\Kerfly\kerfly-console.exe --release-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: K40 USB driver installer (checked)
        run: |
          Invoke-WebRequest -Uri $env:DRIVER_URL -OutFile packaging\windows\K40_Driver_Install.exe
          $hash = (Get-FileHash packaging\windows\K40_Driver_Install.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DRIVER_SHA256) { Write-Error "Driver installer changed: $hash"; exit 1 }
      - name: Installer (Inno Setup)
        run: |
          $version = python -c "import kerfly; print(kerfly.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version packaging\windows\kerfly.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Kerfly-*-windows-setup.exe
          if-no-files-found: error

  linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/macos-') }}
    runs-on: ubuntu-22.04          # older glibc: the AppImage also runs on older systems
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          .github/scripts/apt-install.sh libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libusb-1.0-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -r requirements-optional.txt || echo "pyclipper not installed (optional)"
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage
        env:
          PYTHON: python
          APPIMAGETOOL: ./appimagetool
        run: packaging/linux/build-appimage.sh
      - name: Self-test of the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/*.AppImage
          dist/Kerfly-*-x86_64.AppImage --appimage-extract-and-run --self-test
      - name: Release check of the AppImage (fonts, Qt plugins, libraries)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Kerfly-*-x86_64.AppImage --appimage-extract-and-run --release-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Kerfly-*-x86_64.AppImage
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15            # Apple Silicon (M1 and later)
            arch: arm64
          - runner: macos-15-intel      # older Macs with an Intel processor
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Libraries (libusb from Homebrew goes into the app, LGPL)
        run: |
          brew install libusb
          echo "LIBUSB_DYLIB=$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -r requirements-optional.txt || echo "pyclipper not installed (optional)"
      - name: Kerfly.app (PyInstaller)
        run: python -m PyInstaller packaging/kerfly.spec --noconfirm
      - name: Self-test of the app (must load libusb)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out=$(dist/Kerfly.app/Contents/MacOS/Kerfly --self-test 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 0 ] || exit 1
          echo "$out" | grep -Eq "OK +USB driver" || { echo "::error::the app did not load libusb"; exit 1; }
      - name: Release check of the app (fonts, Qt plugins, libraries)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Kerfly.app/Contents/MacOS/Kerfly --release-test
      - name: Disk image (.dmg)
        run: |
          version=$(python -c "import kerfly; print(kerfly.__version__)")
          mkdir -p dmg
          cp -R dist/Kerfly.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Kerfly $version" -srcfolder dmg -ov -format UDZO \
            "dist/Kerfly-$version-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Kerfly-*-macos-*.dmg
          if-no-files-found: error

  # macos-vX.Y.Z: add the macOS disk images to the existing release vX.Y.Z
  macos-to-release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/macos-v') }}
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: packages
          merge-multiple: true
      - name: Which release
        id: tag
        run: echo "name=${GITHUB_REF_NAME#macos-}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          append_body: true
          body: |

            - **macOS 11 or newer** (added later): `Kerfly-…-macos-arm64.dmg` for Macs with Apple Silicon (M1 and later), `Kerfly-…-macos-x86_64.dmg` for Macs with an Intel processor. A preview, not yet tested with a laser: please report how it works. The app is not signed by Apple; see [INSTALL.md](https://github.com/cyryllo/Kerfly/blob/main/INSTALL.md#macos) for opening it the first time.
          files: packages/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        id: notes
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          echo "title=Kerfly ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: packages/*
