# Build the Windows installer and the Linux AppImage, test them with
# --self-test, and on a version tag (vX.Y.Z) publish them as a GitHub release
# with the notes of that version from CHANGELOG.md.
# To try the packages without a release: Actions -> packages -> Run workflow,
# on any branch (the files are kept as workflow artifacts).
name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Scorch's K40 USB driver installer (modified Zadig, GPL-3), bundled in the Windows installer;
  # the build stops if the file on the server is not this exact one
  DRIVER_URL: http://www.scorchworks.com/K40whisperer/K40_Driver_Install.exe
  DRIVER_SHA256: 6c8e96f436c71f0ade67d7437f87b4d2a53f73eb1316013d87b5353a83d15d16
  # libusb0.dll of libusb-win32 1.2.6.0 (LGPL, the version those driver installers set up), put
  # next to Kerfly.exe as K40 Whisperer does: used only when Windows has none of its own
  LIBUSB_URL: https://sourceforge.net/projects/libusb-win32/files/libusb-win32-releases/1.2.6.0/libusb-win32-bin-1.2.6.0.zip/download
  LIBUSB_SHA256: ac19715e6ace496d1a41df3714038ab0ad9b8059834ed65c55ff4e0b9ba0d2e9

jobs:
  # the release tests must pass before any package is built
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3 libusb-1.0-0
      - name: Libraries
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-optional.txt
      - name: Reference results
        run: .venv/bin/python tests/test_references.py
      - name: Release test (whole session, real clicks, Full HD screen)
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -X faulthandler tests/test_release.py
      - name: Random sessions
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -X faulthandler tests/test_random.py --seed 1 --runs 5 --steps 300
      - name: Keep the differing pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: references-out
          path: tests/references/out/
          if-no-files-found: ignore

  windows:
    needs: release-tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -r requirements-optional.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "pyclipper not installed (optional)"; $global:LASTEXITCODE = 0 }
      - name: Program folder (PyInstaller)
        run: python -m PyInstaller packaging/kerfly.spec --noconfirm
      - name: libusb0.dll next to Kerfly.exe (checked)
        run: |
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri $env:LIBUSB_URL -OutFile libusb-win32.zip -UserAgent "Wget"; break }
            catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds 15 }
          }
          $hash = (Get-FileHash libusb-win32.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LIBUSB_SHA256) { Write-Error "libusb-win32 archive changed: $hash"; exit 1 }
          Expand-Archive libusb-win32.zip -DestinationPath libusb-win32
          Copy-Item libusb-win32\libusb-win32-bin-1.2.6.0\bin\amd64\libusb0.dll dist\Kerfly\
          New-Item -ItemType Directory -Force dist\Kerfly\licenses | Out-Null
          Copy-Item libusb-win32\libusb-win32-bin-1.2.6.0\COPYING_LGPL.txt dist\Kerfly\licenses\libusb-win32-LGPL.txt
      - name: Self-test of the packaged program (must load libusb0.dll)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = & dist\Kerfly\kerfly-console.exe --self-test 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -notmatch "OK\s+USB driver") { Write-Error "the packaged program did not load libusb0.dll"; exit 1 }
      - name: Release check of the packaged program (fonts, Qt plugins, libraries)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & dist\Kerfly\kerfly-console.exe --release-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: K40 USB driver installer (checked)
        run: |
          Invoke-WebRequest -Uri $env:DRIVER_URL -OutFile packaging\windows\K40_Driver_Install.exe
          $hash = (Get-FileHash packaging\windows\K40_Driver_Install.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DRIVER_SHA256) { Write-Error "Driver installer changed: $hash"; exit 1 }
      - name: Installer (Inno Setup)
        run: |
          $version = python -c "import kerfly; print(kerfly.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version packaging\windows\kerfly.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Kerfly-*-windows-setup.exe
          if-no-files-found: error

  linux:
    needs: release-tests
    runs-on: ubuntu-22.04          # older glibc: the AppImage also runs on older systems
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libusb-1.0-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -r requirements-optional.txt || echo "pyclipper not installed (optional)"
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage
        env:
          PYTHON: python
          APPIMAGETOOL: ./appimagetool
        run: packaging/linux/build-appimage.sh
      - name: Self-test of the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/*.AppImage
          dist/Kerfly-*-x86_64.AppImage --appimage-extract-and-run --self-test
      - name: Release check of the AppImage (fonts, Qt plugins, libraries)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Kerfly-*-x86_64.AppImage --appimage-extract-and-run --release-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Kerfly-*-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        id: notes
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          echo "title=Kerfly ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: packages/*
