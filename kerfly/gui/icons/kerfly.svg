<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Kerfly logo: a K whose upper arm is a laser beam ending in a hot spot.
       Copyright (C) 2026 Kerfly contributors, GPL-3.0-or-later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3442"/>
      <stop offset="1" stop-color="#161b23"/>
    </linearGradient>
    <linearGradient id="beam" x1="210" y1="34" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7043" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#ff5722"/>
      <stop offset="1" stop-color="#ffd54f"/>
    </linearGradient>
    <radialGradient id="spot" cx="110" cy="124" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffe082"/>
      <stop offset="0.6" stop-color="#ff7043" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5722" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- stem and lower leg of the K -->
  <rect x="58" y="50" width="38" height="156" rx="6" fill="#eef1f5"/>
  <path d="M96 116 L120 104 L206 194 Q210 206 196 206 L170 206 Z" fill="#eef1f5"/>
  <!-- the laser beam: the upper arm, narrow at the head, wide where it cuts -->
  <path d="M206 30 L214 38 L118 132 L100 114 Z" fill="url(#beam)"/>
  <!-- hot spot where the beam cuts -->
  <circle cx="110" cy="124" r="40" fill="url(#spot)"/>
  <!-- sparks -->
  <g stroke="#ffd54f" stroke-width="5" stroke-linecap="round">
    <path d="M138 113 L156 110"/>
    <path d="M137 124 L152 129"/>
  </g>
  <circle cx="165" cy="119" r="3.5" fill="#ffd54f"/>
</svg>
