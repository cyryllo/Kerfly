<?xml version="1.0" encoding="UTF-8"?>
<!-- Regression fixture: red = vector cut, blue = vector engrave, other = raster -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="80mm" viewBox="0 0 100 80">
  <!-- raster content -->
  <rect x="55" y="15" width="30" height="20" fill="#000000"/>
  <circle cx="70" cy="55" r="10" fill="#808080"/>
  <path d="M 15 65 L 35 65 L 25 50 Z" fill="#404040"/>
  <!-- vector engrave (blue) -->
  <path d="M 12 20 L 20 12 L 28 20 L 36 12 L 44 20" fill="none" stroke="#0000ff" stroke-width="0.1"/>
  <ellipse cx="28" cy="35" rx="12" ry="6" fill="none" stroke="#0000ff" stroke-width="0.1"/>
  <!-- vector cut (red); nested shapes exercise "inside first" ordering -->
  <rect x="5" y="5" width="90" height="70" rx="3" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <circle cx="70" cy="55" r="13" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <rect x="62" y="51" width="16" height="8" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <path d="M 50 70 C 50 60 60 60 60 50 S 40 40 45 30" fill="none" stroke="#ff0000" stroke-width="0.1"/>
</svg>
