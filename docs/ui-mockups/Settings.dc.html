<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kerfly - ustawienia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6aa8}a:hover{color:#1f4f82}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic16{width:16px;height:16px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;padding:0}
.ib:hover{background:#dfe3e8;border-color:#c4c9d0}
.btn{height:32px;min-width:88px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;font-size:12px;padding:0 12px}
.btn:hover{background:#eef0f3}
.sm{height:28px;min-width:0;padding:0 8px}
.fld{height:28px;box-sizing:border-box;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;padding:0 8px;font:inherit;font-size:12px;color:#2b2f36;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:#4b5563}
.hd{font-size:12px;font-weight:600;color:#2b2f36}
.cap{font-size:10px;color:#5b6370;line-height:14px}
.row{display:flex;align-items:center;gap:8px;min-height:28px}
.chk{display:flex;align-items:center;gap:8px;min-height:28px;font-size:12px}
.chk input{margin:0}
.beta{font-size:10px;color:#5b6370;border:1px solid #c4c9d0;border-radius:3px;padding:0 4px;line-height:14px}
</style>
</helmet>
<div style="width: 840px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #2b2f36; background: #f4f5f7; border: 1px solid #9aa1ab; border-radius: 6px; overflow: hidden">
<div style="height: 36px; flex: none; display: flex; align-items: center; padding: 0 4px 0 12px; background: #eef0f3; border-bottom: 1px solid #c4c9d0">
<span style="flex: 1 1 0; font-size: 13px; font-weight: 600">Ustawienia</span>
<button class="ib" aria-label="Zamknij okno"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
</div>
<div style="flex: 1 1 0; min-height: 0; display: flex">
<div style="width: 168px; flex: none; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 2px; background: #eef0f3; border-right: 1px solid #c4c9d0">
<button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: #dce6f2; color: #1f4f82; font-weight: 600; font-size: 12px; text-align: left">Maszyna</button><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; text-align: left">Raster</button><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; text-align: left">Wektor</button><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; text-align: left">Widok</button><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; text-align: left">Oś obrotowa</button><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; text-align: left">Zaawansowane</button>
</div>
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #ffffff">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="hd">Sterownik</span>
<div style="display: grid; grid-template-columns: 200px auto minmax(0, 1fr); column-gap: 12px; row-gap: 6px; align-items: center">
<label class="lbl" for="sb">Płyta sterująca</label><select id="sb" class="fld" style="width: 180px"><option>LASER-M2</option></select><span></span>
<label class="lbl" for="su">Port USB <span class="beta">beta</span></label><select id="su" class="fld" style="width: 180px"><option>Pierwszy znaleziony K40</option></select><button class="btn sm" style="justify-self: start">Który to?</button>
<label class="lbl" for="sj">Jednostki</label><select id="sj" class="fld" style="width: 80px"><option>mm</option></select><span></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="hd">Stół roboczy</span>
<div style="display: grid; grid-template-columns: 200px 96px 96px 96px minmax(0, 1fr); column-gap: 12px; row-gap: 6px; align-items: center">
<span class="lbl">Rozmiar</span><input class="fld" style="width: 96px; text-align: right" value="300,0 mm" aria-label="Szerokość stołu"><span class="lbl" style="text-align: center">×</span><input class="fld" style="width: 96px; text-align: right" value="200,0 mm" aria-label="Wysokość stołu"><span></span>
<span class="lbl">Współczynnik skali</span><input class="fld" style="width: 96px; text-align: right" value="X 1,0000" aria-label="Skala X"><span></span><input class="fld" style="width: 96px; text-align: right" value="Y 1,0000" aria-label="Skala Y"><span></span>
<label class="chk" for="shu" style="grid-column: 1 / -1"><input id="shu" type="checkbox">Baza jest w prawym górnym rogu</label>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="hd">Bazowanie i koniec zadania</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; row-gap: 2px">
<label class="chk" for="s1"><input id="s1" type="checkbox" checked>Bazuj głowicę przy połączeniu</label>
<label class="chk" for="s2"><input id="s2" type="checkbox">Wróć do bazy po zadaniu</label>
<label class="chk" for="s3"><input id="s3" type="checkbox">Odblokuj silniki po zadaniu</label>
<label class="chk" for="s4"><input id="s4" type="checkbox" checked>Sygnał dźwiękowy po zadaniu</label>
<label class="chk" for="s5"><input id="s5" type="checkbox">Pokaż raport po zadaniu</label>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="hd">Programy uruchamiane przy zadaniu</span>
<div style="display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px; align-items: center">
<label class="chk" for="s6"><input id="s6" type="checkbox">Przed zadaniem</label><input class="fld" style="width: 100%" placeholder="program lub skrypt (.bat, .sh)" aria-label="Program przed zadaniem" disabled><button class="btn sm">Wybierz…</button>
<label class="chk" for="s7"><input id="s7" type="checkbox" checked>Po zadaniu</label><input class="fld" style="width: 100%" value="/home/cyryl/bin/wyciag-off.sh" aria-label="Program po zadaniu"><button class="btn sm">Wybierz…</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="hd">Moc (tylko płyta M3)</span>
<div style="display: grid; grid-template-columns: 200px auto minmax(0, 1fr); column-gap: 12px; row-gap: 6px; align-items: center">
<label class="chk" for="s8" style="grid-column: 1 / -1; color: #5b6370"><input id="s8" type="checkbox" disabled>Ustawiaj moc osobno dla każdej operacji</label>
<span class="lbl">Moc maksymalna</span><input class="fld" style="width: 96px; text-align: right; background: #eceef1; color: #5b6370" value="100,0 %" aria-label="Moc maksymalna" disabled><span class="lbl">Na innych płytach moc ustawia pokrętło lasera.</span>
</div>
</div>
</div>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 12px; background: #eef0f3; border-top: 1px solid #c4c9d0">
<span class="lbl" style="flex: 1 1 0">Ustawienia lasera: Mój laser</span>
<button class="btn">Anuluj</button><button class="btn" style="background: {{accent}}; border-color: {{accent}}; color: #ffffff; font-weight: 600">Zapisz</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f6aa8","options":["#2f6aa8","#00695c","#b3541e"]},"$preview":{"width":840,"height":680}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2f6aa8' };
}
}
</script>
</body>
</html>
