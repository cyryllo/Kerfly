<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kerfly - generator pieczątki</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6aa8}a:hover{color:#1f4f82}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic16{width:16px;height:16px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;padding:0}
.ib:hover{background:#dfe3e8;border-color:#c4c9d0}
.btn{height:32px;min-width:88px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;font-size:12px;padding:0 12px}
.btn:hover{background:#eef0f3}
.sm{height:28px;min-width:0;padding:0 8px}
.fld{height:28px;box-sizing:border-box;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;padding:0 8px;font:inherit;font-size:12px;color:#2b2f36;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:#4b5563}
.hd{font-size:12px;font-weight:600;color:#2b2f36}
.cap{font-size:10px;color:#5b6370;line-height:14px}
.row{display:flex;align-items:center;gap:8px;min-height:28px}
.chk{display:flex;align-items:center;gap:8px;min-height:28px;font-size:12px}
.chk input{margin:0}
.beta{font-size:10px;color:#5b6370;border:1px solid #c4c9d0;border-radius:3px;padding:0 4px;line-height:14px}
.seg{display:flex;border:1px solid #b6bcc5;border-radius:4px;overflow:hidden}
.seg button{height:26px;padding:0 10px;border:0;background:#ffffff;font-size:12px;display:flex;align-items:center}
.seg button+button{border-left:1px solid #b6bcc5}
.bar{height:36px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 12px;background:#f7f8fa;border:1px solid #c4c9d0;white-space:nowrap}
.vs{width:1px;align-self:stretch;margin:8px 0;background:#c4c9d0}
</style>
</helmet>
<div style="width: 1040px; height: 700px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #2b2f36; background: #f4f5f7; border: 1px solid #9aa1ab; border-radius: 6px; overflow: hidden">
<div style="height: 36px; flex: none; display: flex; align-items: center; padding: 0 4px 0 12px; background: #eef0f3; border-bottom: 1px solid #c4c9d0">
<span style="flex: 1 1 0; font-size: 13px; font-weight: 600">Generator: Pieczątka</span>
<button class="ib" aria-label="Zamknij okno"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
</div>
<div style="flex: 1 1 0; min-height: 0; display: flex">
<div style="width: 380px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: #ffffff; border-right: 1px solid #c4c9d0; flex: none">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="hd">Rozmiar</span><div style="display: grid; grid-template-columns: minmax(0, 1fr) 76px auto 76px; column-gap: 8px; align-items: center">
<select class="fld" style="width: 100%" aria-label="Rozmiar pieczątki"><option>47 × 18 mm</option><option>Własny rozmiar</option></select>
<input class="fld" style="width: 76px; text-align: right; background: #eceef1; color: #5b6370" value="47,0 mm" aria-label="Szerokość" disabled><span class="lbl">×</span><input class="fld" style="width: 76px; text-align: right; background: #eceef1; color: #5b6370" value="18,0 mm" aria-label="Wysokość" disabled>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="hd">Tekst</span><div style="border: 1px solid #b6bcc5; border-radius: 4px; overflow: hidden; background: #ffffff">
<div style="display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 4px; background: #f7f8fa; border-bottom: 1px solid #e1e4e8">
<button class="ib" aria-label="Pogrubienie" style="background: #dce6f2; border-color: #9db8d6; color: #1f4f82"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z M7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button><button class="ib" aria-label="Kursywa"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h6 M7 19h6 M14 5l-4 14"/></svg></button><button class="ib" aria-label="Podkreślenie"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v6a5 5 0 0 0 10 0V5 M5 20h14"/></svg></button>
<div class="vs" style="margin: 6px 2px"></div>
<button class="ib" aria-label="Większe litery"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-13 5 13 M6 15h6 M18 8v8 M14 12h8"/></svg></button><button class="ib" aria-label="Mniejsze litery"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-13 5 13 M6 15h6 M15 12h6"/></svg></button>
<div class="vs" style="margin: 6px 2px"></div>
<button class="ib" aria-label="Do lewej"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h10 M4 18h14"/></svg></button><button class="ib" aria-label="Do środka" style="background: #dce6f2; border-color: #9db8d6; color: #1f4f82"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M7 12h10 M5 18h14"/></svg></button><button class="ib" aria-label="Do prawej"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M10 12h10 M6 18h14"/></svg></button>
</div>
<div style="height: 76px; padding: 8px; text-align: center; line-height: 1.5; font-size: 13px"><span style="font-weight: 600">TWOJA FIRMA</span><br>ul. Ulica 1, 00-000 Miasto<br>tel. 123 456 789</div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px; align-items: center">
<label class="lbl" for="pfont">Czcionka</label><select id="pfont" class="fld" style="width: 180px"><option>DejaVu Sans</option></select>
<label class="lbl" for="pth">Wysokość liter</label><select id="pth" class="fld" style="width: 180px"><option>Dopasuj do pieczątki</option><option>Własna</option></select>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="hd">Obraz</span><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 6px; align-items: center">
<input class="fld" style="width: 100%" placeholder="brak (PNG, JPG lub SVG)" aria-label="Plik obrazu"><button class="btn sm">Wybierz…</button>
<label class="lbl" for="ppl">Położenie</label><select id="ppl" class="fld" style="width: 180px"><option>Z lewej strony tekstu</option><option>Nad tekstem</option></select>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="hd">Ramka</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 8px; row-gap: 2px">
<label class="cap" for="pfr">Grubość</label><label class="cap" for="pco">Promień narożników</label><label class="cap" for="pma">Margines</label>
<input id="pfr" class="fld" style="width: 100%; text-align: right" value="0,6 mm"><input id="pco" class="fld" style="width: 100%; text-align: right" value="1,0 mm"><input id="pma" class="fld" style="width: 100%; text-align: right" value="1,0 mm">
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="hd">Wykonanie</span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px">
<label class="chk" for="pinv"><input id="pinv" type="checkbox" checked>Wypal tło (do gumy)</label><label class="chk" for="pmir"><input id="pmir" type="checkbox" checked>Odbicie lustrzane</label><label class="chk" for="pout"><input id="pout" type="checkbox" checked>Wytnij obrys</label>
</div></div>
</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
<div style="height: 44px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #c4c9d0; background: #f7f8fa">
<div class="seg"><button style="background: #dce6f2; color: #1f4f82; font-weight: 600">Odbitka</button><button>Guma (lustro)</button></div>
<span style="flex: 1 1 0"></span>
<span class="lbl">Podgląd w skali 5:1</span>
</div>
<div style="flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; background: #eceef1">
<svg viewBox="0 0 520 220" style="width: 520px; height: 220px; font-family: Inter, system-ui, sans-serif" role="img" aria-label="Podgląd odbitki pieczątki z trzema wierszami tekstu w ramce">
<rect x="10" y="10" width="500" height="200" rx="12" style="fill: #ffffff; stroke: #d32f2f; stroke-width: 1.5"></rect>
<rect x="22" y="22" width="476" height="176" rx="8" style="fill: none; stroke: #111111; stroke-width: 6"></rect>
<text x="260" y="88" text-anchor="middle" style="font-size: 38px; font-weight: 600; fill: #111111">TWOJA FIRMA</text>
<text x="260" y="130" text-anchor="middle" style="font-size: 24px; fill: #111111">ul. Ulica 1, 00-000 Miasto</text>
<text x="260" y="166" text-anchor="middle" style="font-size: 24px; fill: #111111">tel. 123 456 789</text>
</svg>
</div>
</div>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 12px; background: #eef0f3; border-top: 1px solid #c4c9d0">
<span class="lbl" style="flex: 1 1 0">47 × 18 mm · grawer rastrowy i cięcie obrysu</span>
<button class="btn">Anuluj</button><button class="btn" style="background: {{accent}}; border-color: {{accent}}; color: #ffffff; font-weight: 600">Wstaw pieczątkę</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f6aa8","options":["#2f6aa8","#00695c","#b3541e"]},"$preview":{"width":1040,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2f6aa8' };
}
}
</script>
</body>
</html>
