<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kerfly - lista generatorów</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6aa8}a:hover{color:#1f4f82}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic16{width:16px;height:16px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;padding:0}
.ib:hover{background:#dfe3e8;border-color:#c4c9d0}
.btn{height:32px;min-width:88px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;font-size:12px;padding:0 12px}
.btn:hover{background:#eef0f3}
.sm{height:28px;min-width:0;padding:0 8px}
.fld{height:28px;box-sizing:border-box;border:1px solid #b6bcc5;border-radius:4px;background:#ffffff;padding:0 8px;font:inherit;font-size:12px;color:#2b2f36;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:#4b5563}
.hd{font-size:12px;font-weight:600;color:#2b2f36}
.cap{font-size:10px;color:#5b6370;line-height:14px}
.row{display:flex;align-items:center;gap:8px;min-height:28px}
.chk{display:flex;align-items:center;gap:8px;min-height:28px;font-size:12px}
.chk input{margin:0}
.beta{font-size:10px;color:#5b6370;border:1px solid #c4c9d0;border-radius:3px;padding:0 4px;line-height:14px}
.mi{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:0;background:transparent;font-size:12px;text-align:left;width:100%}
</style>
</helmet>
<div style="width: 280px; height: 478px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #2b2f36; background: #f4f5f7; border: 1px solid #9aa1ab; border-radius: 6px; overflow: hidden">
<div style="display: flex; flex-direction: column; padding: 4px 0; background: #ffffff; flex: 1 1 0">
<span class="cap" style="padding: 6px 12px 2px">Pudełka</span>
<button class="mi" style="background: {{accent}}; color: #ffffff"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9"/></svg><span>Pudełko na wczepy</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z M9 4v16 M12 4v16"/></svg><span>Zaokrąglone pudełko <span class="beta">beta</span></span></button>
<div style="height: 1px; background: #e1e4e8; margin: 4px 0"></div>
<span class="cap" style="padding: 6px 12px 2px">Elementy</span>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1"/></svg><span>Koło zębate</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h5a2 2 0 1 1 4 0h7v5a2 2 0 1 0 0 4v5H4z"/></svg><span>Puzzle</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v8H3z M7 8v4 M11 8v3 M15 8v4 M19 8v3"/></svg><span>Linijka</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h2v2h-2z M18 18h2v2h-2z M18 14h2 M14 18v2"/></svg><span>Kod QR</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v6l3 4H6l3-4z M5 17h14v3H5z"/></svg><span>Pieczątka</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span>Pieczątka okrągła</span></button>
<div style="height: 1px; background: #e1e4e8; margin: 4px 0"></div>
<span class="cap" style="padding: 6px 12px 2px">Testy i kalibracja</span>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M4 9.3h16 M4 14.6h16 M9.3 4v16 M14.6 4v16"/></svg><span>Test materiału</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M6 6v12 M10 6v12 M14 6v12 M18 6v12"/></svg><span>Test kerfu</span></button>
<button class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h8v3H8z M8 6H5v14h14V6h-3 M9 14l2 2 4-4"/></svg><span>Karta testowa</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f6aa8","options":["#2f6aa8","#00695c","#b3541e"]},"$preview":{"width":280,"height":478}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2f6aa8' };
}
}
</script>
</body>
</html>
